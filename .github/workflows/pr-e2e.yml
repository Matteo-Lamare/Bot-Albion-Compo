name: E2E Playwright

on:
  pull_request:
    branches:
      - main

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: albion
          POSTGRES_USER: albion
          POSTGRES_PASSWORD: albionpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U albion -d albion"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql+psycopg://albion:albionpassword@127.0.0.1:5432/albion
      SECRET_KEY: e2e-test-secret
      APP_BASE_URL: http://127.0.0.1:8000
      ADMIN_PSEUDO: admin
      ADMIN_PASSWORD: admin123
      E2E_ADMIN_PSEUDO: admin
      E2E_ADMIN_PASSWORD: admin123
      E2E_BASE_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances Python
        run: pip install -r requirements.txt

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Installer les dépendances Node
        run: npm ci

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Démarrer l'application
        run: |
          uvicorn backend.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          echo $! > uvicorn.pid

      - name: Attendre l'application
        run: |
          for i in {1..30}; do
            if curl --fail http://127.0.0.1:8000/; then
              exit 0
            fi
            sleep 2
          done

          cat uvicorn.log
          exit 1

      - name: Lancer les tests E2E
        run: npx playwright test

      - name: Publier le rapport Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
