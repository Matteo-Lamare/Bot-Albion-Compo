services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: albion
      POSTGRES_USER: albion
      POSTGRES_PASSWORD: albionpassword
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U albion -d albion"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dbdata: